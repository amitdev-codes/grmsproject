name: Deploy GRMS to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- PHP / Composer (still needed: vendor/ isn't committed) ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, exif, pcntl, gd, zip, pdo_mysql, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ---------- Frontend assets: NOT built here anymore ----------
      # public/build is committed to the repo directly. Run `pnpm build`
      # locally before pushing, and commit the resulting public/build folder.

      # ---------- Clean up before shipping to server ----------
      - name: Strip files that shouldn't be deployed
        run: |
          rm -rf tests
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -f .env .env.example

      # ---------- Ship files to the server ----------
      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".env" --exclude="storage/" --exclude="public/storage" --exclude="/public/uploads"
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ---------- Finish the deploy on the server ----------
      - name: Run post-deploy Artisan commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan down || true
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
            php artisan up
