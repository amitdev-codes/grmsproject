name: Deploy GRMS to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ---------- PHP / Composer (still needed: vendor/ isn't committed) ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, exif, pcntl, gd, zip, pdo_mysql, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ---------- Frontend assets: NOT built here anymore ----------
      # public/build is committed to the repo directly. Run `pnpm build`
      # locally before pushing, and commit the resulting public/build folder.

      # ---------- Package everything into a single archive ----------
      # storage/, .env, .env.example are excluded on purpose — those live
      # only on the server and are never overwritten by a deploy.
      - name: Package build for transfer
        run: |
          rm -f .env .env.example
          tar -czf deploy.tar.gz --exclude=storage --exclude=deploy.tar.gz .

      # ---------- Ship the archive to the server ----------
      - name: Upload archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "deploy.tar.gz"
          target: "~/"
          strip_components: 0

      # ---------- Extract on server and finish the deploy ----------
      - name: Extract archive and run post-deploy Artisan commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }} && php artisan down || true
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            tar -xzf ~/deploy.tar.gz -C ${{ secrets.DEPLOY_PATH }}
            rm -f ~/deploy.tar.gz
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
            php artisan up
